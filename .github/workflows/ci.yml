name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-shape0 libxcb-randr0 \
            libxcb-xinerama0 libxcb-render-util0 libxcb-util1

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywin32

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r . -q --exclude "./.git,./build,./dist,./screenshots,./scripts,./assets" --severity-level medium

      - name: Run test suites (offscreen Qt, Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($t in @('test_functional','test_deep','test_stability','test_stability_v2','test_history_nav','test_features','test_crash','test_tray_toggle','test_open_with','test_shortcuts','test_updater','test_version_sync')) {
            Write-Host "::group::=== $t ==="
            python "scripts/$t.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - name: Run test suites (offscreen Qt, Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          for t in test_functional test_deep test_stability test_stability_v2 \
                   test_history_nav test_features test_crash test_tray_toggle \
                   test_open_with test_shortcuts test_updater test_version_sync; do
            echo "::group::=== $t ==="
            python "scripts/$t.py"
            echo "::endgroup::"
          done

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywin32

      - name: Build exe (PyInstaller + trim)
        run: python build_release.py

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@ec985ef724d1fb4a05bfbc1a8e49930dc76d2b0c # v1.2.9 (pinned: v1.2 tag vanished upstream)
        with:
          path: goldenmusic.iss

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: GoldenMusic-portable
          path: dist/GoldenMusic/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GoldenMusicSetup
          path: dist/installer/*.exe
